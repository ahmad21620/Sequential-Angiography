[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angio-keyframes"
version = "0.1.0"
description = "Keyframe extraction tools for coronary angiogram frame sequences."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "tqdm>=4.66",
]

[project.scripts]
angio-keyframes = "angio_keyframes.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
